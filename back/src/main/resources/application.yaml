spring:
  datasource:
    url: jdbc:mysql://localhost:3306/todo
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  redis:
    host: localhost
    port: 6379
    password: 1234

  jwt:
    prefix: "Bearer "
    access-expiration-time: 900_000 # 15분
    refresh-expiration-time: 604_800_000 # 7일
    secret: mytodo-secret-key!
    accessTokenHeader: Authorization
    refreshTokenHeader: Refresh-Token

  logging:
    level:
      org.hibernate.SQL: debug
      org.hibernate.orm.jdbc.bind: trace