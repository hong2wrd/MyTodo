spring:
  datasource:
    url: jdbc:mysql://localhost:3306/todo
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  redis:
    host: localhost
    port: 6379
    password: 1234

  jwt:
    prefix: "Bearer "
    access-expiration-time: 900_000 # 15분
    refresh-expiration-time: 7 # 7일
    secret: mytodo-secret-key!
    accessTokenHeader: Authorization
    refreshTokenHeader: Refresh-Token

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

cookie:
  secure: false #운영(HTTPS)에서는 true, 개발에서 false

